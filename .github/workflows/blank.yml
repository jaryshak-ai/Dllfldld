name: Build SpOff

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p src/main/java/ru/ruslan/spoff src/main/resources

          cat > pom.xml << 'POM_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.ruslan</groupId>
            <artifactId>SpOff</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
          
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
          
            <repositories>
              <repository>
                <id>opencollab</id>
                <url>https://repo.opencollab.dev/maven-snapshots/</url>
              </repository>
            </repositories>
          
            <dependencies>
              <dependency>
                <groupId>cn.nukkit</groupId>
                <artifactId>nukkit</artifactId>
                <version>1.0-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
          </project>
          POM_EOF

          cat > src/main/resources/plugin.yml << 'YML_EOF'
          name: SpOff
          main: ru.ruslan.spoff.Main
          version: 1.0.0
          api: ["1.0.0"]
          author: Ruslan
          description: /spoff - выход из режима наблюдателя в выживание
          softdepend: [LuckPerms]
          
          commands:
            spoff:
              description: Выйти из режима наблюдателя в выживание
              usage: /spoff
              permission: spoff.use
          
          permissions:
            spoff.use:
              default: op
          YML_EOF

          cat > src/main/java/ru/ruslan/spoff/Main.java << 'JAVA_EOF'
          package ru.ruslan.spoff;
          
          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.utils.TextFormat;
          
          public class Main extends PluginBase {
          
              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (!command.getName().equalsIgnoreCase("spoff")) return false;
          
                  if (!(sender instanceof Player)) {
                      sender.sendMessage(TextFormat.RED + "Только для игроков.");
                      return true;
                  }
          
                  Player player = (Player) sender;
                  if (player.getGamemode() != Player.SPECTATOR) {
                      player.sendMessage(TextFormat.YELLOW + "Вы не в режиме наблюдателя.");
                      return true;
                  }
          
                  player.setGamemode(Player.SURVIVAL);
                  player.sendMessage(TextFormat.GREEN + "Вы вышли из режима наблюдателя. Режим: выживание.");
                  return true;
              }
          }
          JAVA_EOF

      - name: Build
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SpOff
          path: target/SpOff-1.0.0.jar
